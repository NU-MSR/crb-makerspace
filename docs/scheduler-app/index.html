<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRB Makerspace – 3D Printer Scheduler</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Supabase client is imported in app.js -->
</head>

<body>
  <header class="app-header">
    <div class="header-left">
      <button class="menu-button" id="menuButton" aria-label="Open menu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPopover">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
      <h1>3D Printer Scheduler</h1>
    </div>
    <div class="controls">
      <button id="prevDay" aria-label="Previous day">◀</button>
      <button id="todayBtn">Today</button>
      <button id="nextDay" aria-label="Next day">▶</button>
      <input id="datePicker" type="date" />
    </div>
  </header>

  <div class="menu-backdrop" id="menuBackdrop" hidden></div>
  <div class="menu-popover" id="menuPopover" role="menu" hidden>
    <button class="menu-item" id="menuNewReservation" role="menuitem" type="button">
      <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span>New Reservation</span>
    </button>
    <a class="menu-item" id="menuWebsite" role="menuitem" href="../">
      <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      <span>Makerspace Website</span>
    </a>
    <button class="menu-item" id="menuShowHideAll" role="menuitem" type="button">
      <span class="menu-icon" id="menuShowHideAllIcon" aria-hidden="true"></span>
      <span id="menuShowHideAllLabel">Hide All Printers</span>
    </button>
    <div class="menu-divider"></div>
    <div class="menu-printer-list" id="menuPrinterList"></div>
  </div>

  <main class="calendar-container">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading reservations...</div>
    </div>
    <div class="calendar" id="calendar">
      <div class="time-col" id="timeCol"></div>
      <div class="calendar-right">
        <div class="printers-wrapper">
          <div class="printers-header" id="printersHeader"></div>
          <div class="printers" id="printers"></div>
        </div>
      </div>
    </div>
  </main>

  <dialog id="reservationDialog">
    <form method="dialog" id="reservationForm">
      <div class="form-body">
      <h2>New 3D Printer Reservation</h2>
      <div class="field">
        <label for="resPrinter">Printer</label>
        <select id="resPrinter" required></select>
      </div>
      <div class="row">
        <div class="field">
          <label for="resDate">Date</label>
          <input id="resDate" type="date" required />
        </div>
        <div class="field">
          <label for="resStart">Start</label>
          <div class="input-with-btn">
            <input id="resStart" type="time" step="60" required />
            <button type="button" id="resStartNowBtn">Now</button>
            <button type="button" id="resStartAdd30Btn">+30m</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="resDuration">Duration Estimate (h)</label>
          <div class="input-with-btn">
            <input id="resDuration" type="number" min="0.1" max="168" step="0.01" value="1" required />
            <button type="button" id="resDurationResetBtn">Reset</button>
            <button type="button" id="resDurationAdd30Btn">+30m</button>
            <button type="button" id="resDurationAdd60Btn">+1h</button>
          </div>
        </div>
        <div class="field" style="opacity: 0.6;">
          <label for="resEndDisplay">End (calculated)</label>
          <input id="resEndDisplay" type="time" readonly />
          <div id="endMultiDayNote" style="font-size:12px; color: var(--muted);"></div>
        </div>
      </div>

      <div class="field">
        <div id="conflictStatus" class="conflict-status"></div>
      </div>
      <div class="field">
        <label for="resName">Name</label>
        <input id="resName" type="text" maxlength="80" required />
      </div>
      <div class="field">
        <label for="resContact">Email</label>
        <input id="resContact" type="email" maxlength="120" required />
      </div>
      <div class="field checkbox-field">
        <label for="resEmailOptIn">Notifications</label>
        <label class="checkbox-label">
          <input id="resEmailOptIn" type="checkbox" checked />
          Email me when my print finishes or needs attention.
        </label>
      </div>
      <div class="row">
        <div class="field">
          <label for="resLab">Lab/Program</label>
          <select id="resLab" required></select>
          <input id="resLabOther" type="text" placeholder="Specify lab/program" maxlength="80"
            style="display:none; margin-top:6px;" />
        </div>
        <div class="field">
          <label for="resMaterial">Filament Material</label>
          <select id="resMaterial" required></select>
          <input id="resMaterialOther" type="text" placeholder="Specify material" maxlength="80"
            style="display:none; margin-top:6px;" />
        </div>
      </div>
      <div class="field checkbox-field">
        <label for="resVerifyFile">Confirmation</label>
        <label class="checkbox-label">
          <input id="resVerifyFile" type="checkbox" required />
          I've verified my sliced file uses the correct printer model, build plate, and filament.
        </label>
      </div>
      <div class="field">
        <label for="resProjectPart">Project / Part</label>
        <input id="resProjectPart" type="text" maxlength="120" />
      </div>
      <div class="field">
        <label for="resNotes">Notes</label>
        <input id="resNotes" type="text" maxlength="200" />
      </div>
      <div class="error" id="formError" role="alert" aria-live="assertive"></div>
      </div>
      <menu class="dialog-actions">
        <button type="reset" id="cancelBtn">Cancel</button>
        <button type="submit" id="reserveBtn" value="confirm">Reserve</button>
      </menu>
    </form>
  </dialog>

  <template id="printerColumnTemplate">
    <div class="printer-col">
      <div class="printer-header"></div>
      <div class="slots"></div>
    </div>
  </template>

  <button class="fab" id="fabNewReservation" aria-label="New reservation">
    <svg class="fab-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    <span class="fab-label">New Reservation</span>
  </button>

  <script type="module" src="app.js"></script>
</body>

</html>
